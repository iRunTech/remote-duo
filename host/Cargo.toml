[package]
name = "remote-duo-host"
version = "0.1.1"
edition = "2024"
description = "Computer side of Remote Duo: lets the Remote Duo iPhone app control this computer"
license = "Apache-2.0"
repository = "https://github.com/iRunTech/remote-duo"

[dependencies]
anyhow = "1.0.104"
auto-launch = "0.6.0"
dirs = "7.0.0"
enigo = "0.6.1"
futures-util = "0.3.34"
hostname = "0.4.2"
mdns-sd = "0.21.7"
open = "5.4.5"
bzip2 = "0.6"
# No bundled encoder: Cisco's prebuilt library is downloaded on first use (see video/cisco.rs).
openh264 = { version = "0.9.10", default-features = false, features = ["libloading"] }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
rand = "0.10.3"
rcgen = { version = "0.14.10", default-features = false, features = ["ring"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tao = "0.37.2"
tokio = { version = "1.54.1", features = ["full"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = "0.30.0"
tray-icon = "0.26.1"
ureq = { version = "3", default-features = false, features = ["rustls"] }
urlencoding = "2.1.3"
xcap = { version = "0.9.10", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.25"
screencapturekit = "11.1"

[target.'cfg(windows)'.dependencies]
cpal = "0.16"
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }
