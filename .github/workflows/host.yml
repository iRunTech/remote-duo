name: host

on:
  push:
    paths: ["host/**", ".github/workflows/host.yml"]
  pull_request:
    paths: ["host/**", ".github/workflows/host.yml"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bin: remote-duo-host
          - os: windows-latest
            bin: remote-duo-host.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config clang libclang-dev \
            libpipewire-0.3-dev libspa-0.2-dev libdbus-1-dev \
            libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev libxcb-xfixes0-dev \
            libwayland-dev libegl-dev libgbm-dev libxkbcommon-dev \
            libgtk-3-dev libayatana-appindicator3-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: host

      - run: cargo build --release --locked

      - uses: actions/upload-artifact@v4
        with:
          name: remote-duo-host-${{ runner.os }}
          path: host/target/release/${{ matrix.bin }}
